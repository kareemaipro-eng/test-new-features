<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#eef6f2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Next Generation Tennis Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f3f9f6 0%, #e7f2f8 48%, #f6f8ec 100%);
      --glass-bg: rgba(255, 255, 255, 0.68);
      --glass-bg-strong: rgba(255, 255, 255, 0.86);
      --glass-border: rgba(255, 255, 255, 0.88);
      --glass-shadow: 0 12px 32px rgba(15, 45, 35, 0.07), inset 0 1px 1px rgba(255, 255, 255, 0.95);
      --glass-shadow-sm: 0 6px 18px rgba(15, 45, 35, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      --primary: #0f766e;
      --primary-light: #14b8a6;
      --accent: #65a30d;
      --text-main: #0f172a;
      --text-muted: #475569;
      --danger: #dc2626;
      --warning: #d97706;
      --radius-xl: 26px;
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      overscroll-behavior-y: contain;
      touch-action: pan-y;
    }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 108px;
      position: relative;
    }

    /* Ambient Liquid Blobs */
    .liquid-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(65px);
      z-index: -1;
      opacity: 0.65;
      pointer-events: none;
      animation: floatOrb 14s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, #99f6e4, #bae6fd);
      top: -60px;
      right: -50px;
    }
    .orb-2 {
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, #d9f99d, #a7f3d0);
      bottom: 80px;
      left: -70px;
      animation-delay: -5s;
    }
    .orb-3 {
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, #e0f2fe, #fef08a);
      top: 42%;
      right: 25%;
      animation-delay: -9s;
    }
    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-18px, 24px) scale(1.08); }
    }

    /* Liquid Glass Utility */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(22px) saturate(185%);
      -webkit-backdrop-filter: blur(22px) saturate(185%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    .glass-card {
      position: relative;
      z-index: 1;
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow-sm);
      border-radius: var(--radius-lg);
      padding: 16px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .dd-host-open,
    .glass-card:has(.glass-dd.open),
    .filter-toolbar:has(.glass-dd.open),
    .filter-toolbar-3:has(.glass-dd.open) {
      position: relative;
      z-index: 55 !important;
    }

    .filter-toolbar {
      position: relative;
      z-index: 20;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .filter-toolbar-3 {
      position: relative;
      z-index: 20;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-bottom: 10px;
    }
    /* Custom Liquid Glass Dropdown */
    .glass-dd {
      position: relative;
      width: 100%;
    }
    .glass-dd-btn {
      width: 100%;
      padding: 8px 11px;
      border-radius: 13px;
      border: 1px solid rgba(255, 255, 255, 0.95);
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      box-shadow: 0 3px 10px rgba(15, 45, 35, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      transition: all 0.2s ease;
      text-align: right;
    }
    .glass-dd-btn span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .glass-dd-btn svg {
      flex-shrink: 0;
      transition: transform 0.22s ease;
    }
    .glass-dd.open .glass-dd-btn {
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 6px 18px rgba(15, 118, 110, 0.12);
    }
    .glass-dd.open .glass-dd-btn svg {
      transform: rotate(180deg);
    }
    .glass-dd-btn.is-filtered {
      background: linear-gradient(135deg, rgba(15, 118, 110, 0.14), rgba(101, 163, 13, 0.14));
      border-color: rgba(15, 118, 110, 0.45);
      color: var(--primary);
    }
    .glass-dd-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 100%;
      width: max-content;
      max-width: 240px;
      max-height: 220px;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(26px) saturate(200%);
      -webkit-backdrop-filter: blur(26px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.96);
      border-radius: 16px;
      padding: 6px;
      box-shadow: 0 16px 38px rgba(15, 45, 35, 0.15), inset 0 1px 1px #fff;
      z-index: 65;
      display: none;
      flex-direction: column;
      gap: 3px;
      animation: ddPop 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .glass-dd.open .glass-dd-menu {
      display: flex;
    }
    @keyframes ddPop {
      from { opacity: 0; transform: translateY(-6px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .glass-dd-item {
      width: 100%;
      padding: 8px 11px;
      border: none;
      border-radius: 11px;
      background: transparent;
      color: var(--text-main);
      font-size: 12px;
      font-weight: 700;
      text-align: right;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: background 0.16s, color 0.16s;
    }
    .glass-dd-item:hover {
      background: rgba(20, 184, 166, 0.1);
    }
    .glass-dd-item.selected {
      background: linear-gradient(135deg, rgba(15, 118, 110, 0.16), rgba(101, 163, 13, 0.16));
      color: var(--primary);
    }

    /* Skeleton Shimmer Loading */
    .skeleton-card {
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 12px;
      overflow: hidden;
      position: relative;
    }
    .skeleton-line {
      height: 14px;
      border-radius: 8px;
      background: linear-gradient(90deg, rgba(203,213,225,0.35) 25%, rgba(255,255,255,0.85) 50%, rgba(203,213,225,0.35) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      margin-bottom: 10px;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Pull to refresh indicator */
    .ptr-indicator {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      height: 0;
      overflow: hidden;
      transition: height 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* App Container */
    .app-shell {
      max-width: 540px;
      margin: 0 auto;
      padding: 14px 16px;
    }

    /* Top Header */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-radius: var(--radius-xl);
      margin-bottom: 14px;
      position: sticky;
      top: 10px;
      z-index: 40;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, #0f766e, #65a30d);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      box-shadow: 0 6px 14px rgba(15, 118, 110, 0.25);
      overflow: hidden;
      padding: 0;
    }

    .brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand-text h1 {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.2;
    }

    .brand-text span {
      font-size: 11px;
      color: var(--primary);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
      box-shadow: 0 0 8px #10b981;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-pill {
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
      transition: all 0.2s;
    }
    .icon-pill:active { transform: scale(0.95); }

    /* Role Banner */
    .role-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      margin-bottom: 14px;
      font-size: 12.5px;
      background: rgba(255, 255, 255, 0.58);
      border: 1px solid rgba(255, 255, 255, 0.88);
    }

    .badge {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .badge-teal { background: rgba(20, 184, 166, 0.15); color: #0f766e; }
    .badge-lime { background: rgba(101, 163, 13, 0.16); color: #4d7c0f; }
    .badge-amber { background: rgba(245, 158, 11, 0.16); color: #b45309; }
    .badge-red { background: rgba(239, 68, 68, 0.15); color: #b91c1c; }

    /* Hero & Today Highlight Card */
    .hero-card {
      background: linear-gradient(135deg, rgba(15, 118, 110, 0.9), rgba(20, 184, 166, 0.84));
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: var(--radius-xl);
      padding: 20px;
      color: #fff;
      margin-bottom: 16px;
      box-shadow: 0 14px 30px rgba(15, 118, 110, 0.22);
      position: relative;
      overflow: hidden;
    }
    .hero-card::after {
      content: '';
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      top: -40px;
      left: -30px;
      pointer-events: none;
    }
    .hero-card h2 { font-size: 19px; font-weight: 800; margin-bottom: 4px; }
    .hero-card p { font-size: 13px; opacity: 0.94; line-height: 1.5; }

    .today-banner {
      background: linear-gradient(135deg, rgba(101, 163, 13, 0.16), rgba(20, 184, 166, 0.14));
      border: 1px solid rgba(101, 163, 13, 0.4);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      margin-bottom: 14px;
    }

    /* Executive Dashboard Specific Components */
    .exec-hero {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.88), rgba(15, 118, 110, 0.88));
      backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: var(--radius-xl);
      padding: 18px;
      color: #fff;
      margin-bottom: 14px;
      box-shadow: 0 14px 32px rgba(15, 23, 42, 0.18);
    }

    .kpi-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 11px;
      margin-bottom: 14px;
    }

    .kpi-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.92);
      border-radius: var(--radius-lg);
      padding: 14px;
      box-shadow: var(--glass-shadow-sm);
    }
    .kpi-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .kpi-label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .kpi-val {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.2;
    }
    .kpi-sub {
      font-size: 11px;
      font-weight: 700;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Donut Ring Chart */
    .donut-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .donut-ring {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.08);
    }
    .donut-hole {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      color: var(--text-main);
    }

    /* Progress Bar */
    .prog-track {
      width: 100%;
      height: 9px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.22);
      overflow: hidden;
      margin: 6px 0;
    }
    .prog-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.5s ease;
    }

    /* Comparison Row */
    .comp-row {
      padding: 12px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.92);
      margin-bottom: 10px;
    }
    .comp-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 8px;
      text-align: center;
    }
    .comp-cell {
      background: rgba(255, 255, 255, 0.72);
      padding: 6px 4px;
      border-radius: 10px;
    }
    .comp-cell small {
      display: block;
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .comp-cell strong {
      font-size: 13px;
      font-weight: 800;
    }

    /* Filter Pills Row */
    .filter-row {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-chip {
      padding: 6px 13px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.65);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Grid Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-box {
      padding: 14px;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .stat-icon {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: rgba(20, 184, 166, 0.14);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .stat-info h3 { font-size: 20px; font-weight: 800; line-height: 1.1; }
    .stat-info span { font-size: 12px; color: var(--text-muted); font-weight: 600; }

    /* Section Header */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 14px 0 10px;
    }
    .section-head h3 {
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    /* Buttons */
    .btn {
      border: none;
      border-radius: 13px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      color: #fff;
      box-shadow: 0 6px 16px rgba(15, 118, 110, 0.24);
    }
    .btn-accent {
      background: linear-gradient(135deg, #65a30d, #84cc16);
      color: #fff;
      box-shadow: 0 6px 16px rgba(101, 163, 13, 0.24);
    }
    .btn-glass {
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.95);
      color: var(--text-main);
    }
    .btn-danger {
      background: rgba(220, 38, 38, 0.12);
      color: var(--danger);
    }
    .btn-sm { padding: 6px 11px; font-size: 12px; border-radius: 10px; }
    .btn-block { width: 100%; }

    /* Cards List */
    .cards-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cover-img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 10px;
      background: #e2e8f0;
    }

    .avatar-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar-img {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      object-fit: cover;
      border: 2px solid #fff;
      background: #cbd5e1;
      flex-shrink: 0;
    }

    .meta-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .meta-chip {
      background: rgba(255, 255, 255, 0.74);
      border: 1px solid rgba(255, 255, 255, 0.92);
      padding: 4px 9px;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
    }

    .note-box {
      margin-top: 9px;
      padding: 8px 11px;
      border-radius: 11px;
      background: rgba(254, 243, 199, 0.58);
      border: 1px solid rgba(251, 191, 36, 0.35);
      font-size: 12px;
      color: #78350f;
    }

    .attendance-box {
      margin-top: 8px;
      padding: 7px 11px;
      border-radius: 11px;
      background: rgba(209, 250, 229, 0.58);
      border: 1px solid rgba(16, 185, 129, 0.35);
      font-size: 12px;
      color: #065f46;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 11px;
      padding-top: 10px;
      border-top: 1px solid rgba(15, 23, 42, 0.06);
      flex-wrap: wrap;
    }

    /* Bottom Liquid Glass Dock (5 Icons) */
    .bottom-dock {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 500px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(26px) saturate(200%);
      -webkit-backdrop-filter: blur(26px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 14px 36px rgba(15, 45, 35, 0.14), inset 0 1px 1px #fff;
      border-radius: 26px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 7px 6px;
      z-index: 50;
    }

    .dock-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 2px;
      border-radius: 18px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.22s ease;
    }

    .dock-item.active {
      background: linear-gradient(135deg, rgba(15, 118, 110, 0.14), rgba(101, 163, 13, 0.14));
      color: var(--primary);
      transform: translateY(-2px);
    }

    /* Side Drawer (More Menu) */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.28);
      backdrop-filter: blur(4px);
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .side-drawer {
      position: fixed;
      top: 12px;
      bottom: 12px;
      left: 12px;
      width: 285px;
      max-width: 82vw;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1px solid #fff;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.18);
      z-index: 70;
      padding: 20px 16px;
      transform: translateX(-115%);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .side-drawer.open {
      transform: translateX(0);
    }

    .drawer-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.58);
      color: var(--text-main);
      font-size: 13.5px;
      font-weight: 700;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .drawer-link:hover, .drawer-link.active {
      background: rgba(20, 184, 166, 0.14);
      color: var(--primary);
      border-color: rgba(20, 184, 166, 0.3);
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.36);
      backdrop-filter: blur(6px);
      z-index: 80;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }

    .modal-box {
      width: 100%;
      max-width: 440px;
      max-height: 88vh;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(28px);
      border: 1px solid #fff;
      border-radius: 26px;
      padding: 20px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.2);
    }

    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      margin-bottom: 5px;
      color: var(--text-main);
    }
    .form-control {
      width: 100%;
      padding: 10px 13px;
      border-radius: 13px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(255, 255, 255, 0.88);
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-control:focus { border-color: var(--primary); }

    .tabs-row {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      background: rgba(255, 255, 255, 0.55);
      padding: 5px;
      border-radius: 14px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px;
      border-radius: 10px;
      border: none;
      background: transparent;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
    }
    .tab-btn.active {
      background: #fff;
      color: var(--primary);
      box-shadow: 0 3px 10px rgba(0,0,0,0.06);
    }

    .empty-state {
      text-align: center;
      padding: 34px 18px;
      border-radius: var(--radius-xl);
    }
    .empty-state p {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-top: 8px;
      line-height: 1.6;
    }

    .toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: rgba(15, 23, 42, 0.92);
      color: #fff;
      padding: 10px 18px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      z-index: 100;
      transition: transform 0.3s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      max-width: 90vw;
      text-align: center;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="liquid-orb orb-1"></div>
  <div class="liquid-orb orb-2"></div>
  <div class="liquid-orb orb-3"></div>

  <div id="toast" class="toast"></div>

  <div class="app-shell" id="appShell">
    <div id="ptrIndicator" class="ptr-indicator">
      <i data-lucide="arrow-down" style="width:14px;height:14px;"></i>
      <span>اسحب للتحديث الفوري</span>
    </div>

    <!-- Top Header -->
    <header class="top-bar glass">
      <div class="brand">
        <div class="brand-logo"><img src="./logo.png" alt="Logo" /></div>
        <div class="brand-text">
          <h1>Next Generation</h1>
          <span><i class="sync-dot"></i> متصل ومزامن تلقائياً</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-pill" onclick="refreshData(true)" title="تحديث البيانات الآن">
          <i data-lucide="refresh-cw" style="width:14px;height:14px;"></i>
        </button>
        <button id="authHeaderBtn" class="icon-pill" onclick="openLoginModal()">
          <i data-lucide="log-in" style="width:14px;height:14px;"></i>
          <span>دخول</span>
        </button>
      </div>
    </header>

    <!-- User Role Status Strip -->
    <div class="role-strip">
      <div id="roleInfoText">مرحباً بك كزائر في الأكاديمية</div>
      <span id="roleBadge" class="badge badge-teal">وضع الزائر</span>
    </div>

    <!-- Main Dynamic View Container -->
    <main id="mainContent"></main>
  </div>

  <!-- Bottom Navigation Bar (5 Icons) -->
  <nav class="bottom-dock">
    <button class="dock-item active" data-view="home" onclick="navigate('home')">
      <i data-lucide="home" style="width:20px;height:20px;"></i>
      <span>الرئيسية</span>
    </button>
    <button class="dock-item" data-view="teams" onclick="navigate('teams')">
      <i data-lucide="shield" style="width:20px;height:20px;"></i>
      <span>الفرق</span>
    </button>
    <button class="dock-item" data-view="players" onclick="navigate('players')">
      <i data-lucide="users" style="width:20px;height:20px;"></i>
      <span>اللاعبين</span>
    </button>
    <button class="dock-item" data-view="schedule" onclick="navigate('schedule')">
      <i data-lucide="calendar" style="width:20px;height:20px;"></i>
      <span>المواعيد</span>
    </button>
    <button class="dock-item" data-view="more" onclick="toggleDrawer(true)">
      <i data-lucide="layout-grid" style="width:20px;height:20px;"></i>
      <span>المزيد</span>
    </button>
  </nav>

  <!-- Side Drawer for Remaining Sheets & Executive Dashboard -->
  <div id="drawerBackdrop" class="drawer-backdrop" onclick="toggleDrawer(false)"></div>
  <aside id="sideDrawer" class="side-drawer">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
      <div>
        <h3 style="font-size:16px;font-weight:800;">أقسام الأكاديمية</h3>
        <span style="font-size:11.5px;color:var(--text-muted);">باقي الشيتات والتحليلات</span>
      </div>
      <button class="icon-pill" onclick="toggleDrawer(false)">
        <i data-lucide="x" style="width:16px;height:16px;"></i>
      </button>
    </div>

    <div id="drawerLinksContainer"></div>

    <div style="margin-top:auto;padding-top:14px;border-top:1px solid rgba(0,0,0,0.06);">
      <button id="drawerAuthBtn" class="btn btn-primary btn-block" onclick="toggleDrawer(false); openLoginModal();">
        <i data-lucide="key-round" style="width:16px;height:16px;"></i>
        تسجيل الدخول / تغيير الحساب
      </button>
    </div>
  </aside>

  <!-- Login Modal -->
  <div id="loginModal" class="modal-overlay">
    <div class="modal-box">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <h3 style="font-size:17px;font-weight:800;">تسجيل الدخول للأكاديمية</h3>
        <button class="icon-pill" onclick="closeModal('loginModal')"><i data-lucide="x" style="width:15px;height:15px;"></i></button>
      </div>

      <div class="tabs-row">
        <button class="tab-btn active" id="tabParent" onclick="setLoginMode('parent')">ولي أمر / لاعب</button>
        <button class="tab-btn" id="tabStaff" onclick="setLoginMode('staff')">مدرب / إدارة</button>
      </div>

      <div class="form-group">
        <label>البريد الإلكتروني المسجل</label>
        <input type="email" id="loginEmail" class="form-control" placeholder="example@domain.com" dir="ltr" />
      </div>

      <div class="form-group" id="loginCodeGroup" style="display:none;">
        <label>رمز الدخول (Login Code)</label>
        <input type="password" id="loginCode" class="form-control" placeholder="أدخل الكود الخاص بك" dir="ltr" />
      </div>

      <p id="loginHintText" style="font-size:12px;color:var(--text-muted);margin-bottom:14px;line-height:1.5;">
        يدخل ولي الأمر بالبريد الإلكتروني المسجل في شيت اللاعبين مباشرة بدون كود.
      </p>

      <div id="pendingAlertBox" style="display:none;margin-bottom:12px;padding:12px;border-radius:14px;background:rgba(245,158,11,0.14);border:1px solid rgba(245,158,11,0.4);font-size:12.5px;color:#92400e;line-height:1.6;"></div>

      <button class="btn btn-primary btn-block" onclick="submitLogin()">دخول</button>

      <div style="margin-top:14px;padding-top:12px;border-top:1px solid rgba(0,0,0,0.07);text-align:center;">
        <span style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:6px;">لاعب جديد غير مسجل بعد؟</span>
        <button class="btn btn-glass btn-sm btn-block" onclick="closeModal('loginModal'); navigate('admin');">
          الذهاب لصفحة الإدارة وملء استمارة التسجيل
        </button>
      </div>
    </div>
  </div>

  <!-- CRUD / Edit Modal -->
  <div id="crudModal" class="modal-overlay">
    <div class="modal-box">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <h3 id="crudModalTitle" style="font-size:16px;font-weight:800;">تعديل البيانات</h3>
        <button class="icon-pill" onclick="closeModal('crudModal')"><i data-lucide="x" style="width:15px;height:15px;"></i></button>
      </div>
      <form id="crudForm" onsubmit="submitCrudForm(event)"></form>
    </div>
  </div>

  <script>
    // =========================================================================
    // رابط النشر (Web App URL) الخاص بكود Google Apps Script
    // =========================================================================
    const API_URL = 'https://script.google.com/macros/s/AKfycbxIBP6rAKa6iE1pC_2Y0Zbi2Eu9ZnMq-h01Jo2xuuG5Dx93znJEDtRMqyOky_oeeW__mg/exec';

    let appState = {
      currentView: 'home',
      loginMode: 'parent',
      scheduleFilter: 'all',
      scheduleTeamFilter: 'all',
      scheduleCoachFilter: 'all',
      eduFilter: 'all',
      eduMediaFilter: 'all',
      teamSearch: '',
      teamCoachFilter: 'all',
      playerSearch: '',
      playerTeamFilter: 'all',
      playerNotesFilter: 'all',
      privateSearch: '',
      privateStatusFilter: 'all',
      subStatusFilter: 'all',
      subMonthFilter: 'all',
      coachBranchFilter: 'all',
      user: JSON.parse(localStorage.getItem('nxtgen_user') || 'null'),
      data: null,
      autoSyncTimer: null
    };

    const ROLE_LABELS = {
      super_admin: { text: 'المدير العام (صلاحية كاملة)', badge: 'badge-lime' },
      admin_staff: { text: 'فريق الإدارة', badge: 'badge-teal' },
      coach: { text: 'مدرب معتمد', badge: 'badge-teal' },
      parent: { text: 'ولي أمر لاعب', badge: 'badge-lime' },
      guest: { text: 'وضع الزائر', badge: 'badge-amber' }
    };

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      setupPullToRefresh();
      updateAuthUI();
      refreshData(false);
      appState.autoSyncTimer = setInterval(() => refreshData(false, true), 20000);
    });

    // Custom Liquid Glass Dropdown Helper
    function renderGlassDropdown(id, currentVal, options, onSelectFnName) {
      const selectedOpt = options.find(o => String(o.value) === String(currentVal)) || options[0];
      const isFiltered = String(currentVal) !== 'all';
      return `
        <div class="glass-dd" id="dd_${id}">
          <button type="button" class="glass-dd-btn ${isFiltered ? 'is-filtered' : ''}" onclick="toggleGlassDropdown(event, 'dd_${id}')">
            <span>${escapeHtml(selectedOpt ? selectedOpt.label : '')}</span>
            <i data-lucide="chevron-down" style="width:14px;height:14px;"></i>
          </button>
          <div class="glass-dd-menu">
            ${options.map(opt => {
              const active = String(opt.value) === String(currentVal);
              return `
                <button type="button" class="glass-dd-item ${active ? 'selected' : ''}"
                        onclick="${onSelectFnName}('${escapeHtml(String(opt.value))}')">
                  <span>${escapeHtml(opt.label)}</span>
                  ${active ? '<i data-lucide="check" style="width:13px;height:13px;color:var(--primary);"></i>' : ''}
                </button>`;
            }).join('')}
          </div>
        </div>`;
    }

    function closeAllGlassDropdowns() {
      document.querySelectorAll('.glass-dd.open').forEach(el => el.classList.remove('open'));
      document.querySelectorAll('.dd-host-open').forEach(el => el.classList.remove('dd-host-open'));
    }

    function toggleGlassDropdown(e, ddId) {
      e.stopPropagation();
      const target = document.getElementById(ddId);
      const wasOpen = target && target.classList.contains('open');
      closeAllGlassDropdowns();
      if (target && !wasOpen) {
        target.classList.add('open');
        const hostCard = target.closest('.glass-card, .filter-toolbar, .filter-toolbar-3');
        if (hostCard) hostCard.classList.add('dd-host-open');
      }
    }

    document.addEventListener('click', closeAllGlassDropdowns);

    function onSelectTeamCoach(val) { appState.teamCoachFilter = val; renderCurrentView(); }
    function onSelectPlayerTeam(val) { appState.playerTeamFilter = val; renderCurrentView(); }
    function onSelectPlayerNotes(val) { appState.playerNotesFilter = val; renderCurrentView(); }
    function onSelectScheduleTeam(val) { appState.scheduleTeamFilter = val; renderCurrentView(); }
    function onSelectScheduleCoach(val) { appState.scheduleCoachFilter = val; renderCurrentView(); }
    function onSelectPrivateStatus(val) { appState.privateStatusFilter = val; renderCurrentView(); }
    function onSelectEduMedia(val) { appState.eduMediaFilter = val; renderCurrentView(); }
    function onSelectCoachBranch(val) { appState.coachBranchFilter = val; renderCurrentView(); }
    function onSelectSubStatus(val) { appState.subStatusFilter = val; renderCurrentView(); }
    function onSelectSubMonth(val) { appState.subMonthFilter = val; renderCurrentView(); }

    function setupPullToRefresh() {
      let startY = 0;
      const ptr = document.getElementById('ptrIndicator');
      window.addEventListener('touchstart', e => {
        if (window.scrollY === 0) startY = e.touches[0].clientY;
      }, { passive: true });
      window.addEventListener('touchmove', e => {
        if (window.scrollY === 0 && startY > 0) {
          const diff = e.touches[0].clientY - startY;
          if (diff > 20 && diff < 120) {
            ptr.style.height = Math.min(diff * 0.45, 38) + 'px';
          }
        }
      }, { passive: true });
      window.addEventListener('touchend', () => {
        if (parseInt(ptr.style.height || '0') >= 32) {
          refreshData(true);
        }
        ptr.style.height = '0px';
        startY = 0;
      });
    }

    function renderSkeletons(count = 3) {
      let html = '';
      for (let i = 0; i < count; i++) {
        html += `
          <div class="skeleton-card">
            <div class="skeleton-line" style="width:55%;height:16px;"></div>
            <div class="skeleton-line" style="width:85%;"></div>
            <div class="skeleton-line" style="width:40%;margin-bottom:0;"></div>
          </div>`;
      }
      return html;
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3600);
    }

    function updateAuthUI() {
      const u = appState.user;
      const roleInfo = document.getElementById('roleInfoText');
      const roleBadge = document.getElementById('roleBadge');
      const headerBtn = document.getElementById('authHeaderBtn');
      const drawerBtn = document.getElementById('drawerAuthBtn');

      if (u && u.role && u.role !== 'guest') {
        const meta = ROLE_LABELS[u.role] || ROLE_LABELS.guest;
        roleInfo.innerHTML = `أهلاً، <strong>${escapeHtml(u.name || '')}</strong>`;
        roleBadge.className = `badge ${meta.badge}`;
        roleBadge.textContent = meta.text;
        headerBtn.innerHTML = `<i data-lucide="log-out" style="width:14px;height:14px;"></i><span>خروج</span>`;
        headerBtn.onclick = logoutUser;
        drawerBtn.innerHTML = `<i data-lucide="log-out" style="width:16px;height:16px;"></i> تسجيل الخروج (${escapeHtml(u.name || '')})`;
        drawerBtn.onclick = () => { toggleDrawer(false); logoutUser(); };
      } else {
        roleInfo.textContent = 'تصفح كزائر (سجل دخولك لعرض بياناتك)';
        roleBadge.className = 'badge badge-amber';
        roleBadge.textContent = 'وضع الزائر';
        headerBtn.innerHTML = `<i data-lucide="log-in" style="width:14px;height:14px;"></i><span>دخول</span>`;
        headerBtn.onclick = openLoginModal;
        drawerBtn.innerHTML = `<i data-lucide="key-round" style="width:16px;height:16px;"></i> تسجيل الدخول للحساب`;
        drawerBtn.onclick = () => { toggleDrawer(false); openLoginModal(); };
      }
      renderDrawerLinks();
      lucide.createIcons();
    }

    function renderDrawerLinks() {
      const role = appState.user?.role || 'guest';
      const isSuperAdmin = role === 'super_admin';
      const isStaff = ['super_admin', 'admin_staff', 'coach'].includes(role);
      const isParent = role === 'parent';

      const items = [
        { id: 'dashboard', label: 'لوحة تحكم المدير العام (KPIs)', icon: 'bar-chart-3', visible: isSuperAdmin, highlight: true },
        { id: 'private', label: 'حصص البرايفت (Private)', icon: 'sparkles', visible: true },
        { id: 'education', label: 'المحتوى التعليمي', icon: 'play-circle', visible: true },
        { id: 'coaches', label: 'المدربون', icon: 'award', visible: true },
        { id: 'subscriptions', label: 'الاشتراكات والمدفوعات', icon: 'credit-card', visible: isStaff || isParent },
        { id: 'admin', label: 'الإدارة وتسجيل اللاعبين', icon: 'building-2', visible: true },
        { id: 'responses', label: 'طلبات التسجيل الجديدة', icon: 'file-check', visible: ['super_admin', 'admin_staff'].includes(role) }
      ];

      const container = document.getElementById('drawerLinksContainer');
      container.innerHTML = items.filter(i => i.visible).map(item => `
        <button class="drawer-link ${appState.currentView === item.id ? 'active' : ''}"
                style="${item.highlight ? 'background:linear-gradient(135deg, rgba(15,118,110,0.16), rgba(101,163,13,0.16));border-color:rgba(15,118,110,0.35);' : ''}"
                onclick="toggleDrawer(false); navigate('${item.id}')">
          <span style="display:flex;align-items:center;gap:10px;">
            <i data-lucide="${item.icon}" style="width:18px;height:18px;color:var(--primary);"></i>
            ${item.label}
          </span>
          <i data-lucide="chevron-left" style="width:16px;height:16px;opacity:0.5;"></i>
        </button>
      `).join('');
      lucide.createIcons();
    }

    function requestJsonp(baseUrl) {
      return new Promise((resolve, reject) => {
        const cbName = 'nxtgen_cb_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
        const script = document.createElement('script');
        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error('انتهت مهلة الاتصال بالخادم (Timeout)'));
        }, 12000);

        function cleanup() {
          clearTimeout(timeout);
          if (script.parentNode) script.parentNode.removeChild(script);
          try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
        }

        window[cbName] = function(data) {
          cleanup();
          resolve(data);
        };

        script.onerror = function() {
          cleanup();
          reject(new Error('فشل تحميل السكربت من Google Apps Script'));
        };

        const sep = baseUrl.includes('?') ? '&' : '?';
        script.src = baseUrl + sep + 'callback=' + cbName;
        document.body.appendChild(script);
      });
    }

    async function refreshData(manual = false, silent = false) {
      if (!silent) {
        document.getElementById('mainContent').innerHTML = renderSkeletons(3);
      }
      try {
        const u = appState.user || {};
        const url = new URL(API_URL);
        url.searchParams.set('action', 'getData');
        if (u.email) url.searchParams.set('authEmail', u.email);
        if (u.code) url.searchParams.set('authCode', u.code);

        let json;
        try {
          json = await requestJsonp(url.toString());
        } catch (jsonpErr) {
          const res = await fetch(url.toString(), { cache: 'no-store' });
          json = await res.json();
        }
        if (json.status === 'success') {
          appState.data = json;
          renderCurrentView();
          if (manual) showToast('تم تحديث البيانات والتحليلات من الشيت بنجاح');
        } else {
          if (!silent) {
            showToast(json.message || 'تعذر تحميل البيانات');
            document.getElementById('mainContent').innerHTML = `
              <div class="glass-card empty-state">
                <i data-lucide="alert-circle" style="width:36px;height:36px;color:var(--danger);"></i>
                <h3 style="margin-top:8px;">تنبيه من السيرفر</h3>
                <p>${escapeHtml(json.message || 'تعذر تحميل البيانات من الشيت')}</p>
                <button class="btn btn-primary" style="margin-top:12px;" onclick="refreshData(true)">إعادة المحاولة</button>
              </div>`;
            lucide.createIcons();
          }
        }
      } catch (err) {
        if (!silent) {
          document.getElementById('mainContent').innerHTML = `
            <div class="glass-card empty-state">

    async function submitLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const code = document.getElementById('loginCode').value.trim();
      const pendingBox = document.getElementById('pendingAlertBox');
      pendingBox.style.display = 'none';

      if (!email) {
        showToast('يرجى إدخال البريد الإلكتروني');
        return;
      }
      if (appState.loginMode === 'staff' && !code) {
        showToast('يرجى إدخال رمز الدخول (Login Code)');
        return;
      }

      try {
        const url = new URL(API_URL);
        url.searchParams.set('action', 'login');
        url.searchParams.set('email', email);
        if (code) url.searchParams.set('code', code);

        let json;
        try {
          json = await requestJsonp(url.toString());
        } catch (jsonpErr) {
          const res = await fetch(url.toString(), { cache: 'no-store' });
          json = await res.json();
        }

        if (json.status === 'success') {
          appState.user = { ...json.user, code: code };
          localStorage.setItem('nxtgen_user', JSON.stringify(appState.user));
          closeModal('loginModal');
          updateAuthUI();
          showToast(`مرحباً بك ${json.user.name}`);
          refreshData(false);
        } else if (json.status === 'pending') {
          pendingBox.innerHTML = `<strong><i data-lucide="hourglass" style="width:14px;height:14px;vertical-align:middle;"></i> طلبك قيد التفعيل:</strong><br>${escapeHtml(json.message)}`;
          pendingBox.style.display = 'block';
          lucide.createIcons();
        } else {
          showToast(json.message || 'بيانات الدخول غير صحيحة');
        }
      } catch (e) {
        showToast('حدث خطأ أثناء تسجيل الدخول');
      }
    }

    function downloadSessionICS(title, dateStr, timeStr, locationStr) {
      try {
        const cleanDate = String(dateStr || '').replace(/[^0-9]/g, '');
        const cleanTime = String(timeStr || '17:00:00').replace(/[^0-9]/g, '').padEnd(6, '0').slice(0, 6);
        if (cleanDate.length !== 8) {
          showToast('صيغة التاريخ غير مكتملة لإضافتها للتقويم');
          return;
        }
        const startDT = `${cleanDate}T${cleanTime}`;
        const endHour = String(Math.min(23, parseInt(cleanTime.slice(0, 2), 10) + 1)).padStart(2, '0');
        const endDT = `${cleanDate}T${endHour}${cleanTime.slice(2)}`;

        const icsContent = [
          'BEGIN:VCALENDAR',
          'VERSION:2.0',
          'PRODID:-//Next Generation Tennis Academy//AR',
          'BEGIN:VEVENT',
          `DTSTART:${startDT}`,
          `DTEND:${endDT}`,
          `SUMMARY:${title} - NXT Gen Tennis`,
          `LOCATION:${locationStr}`,
          'DESCRIPTION:موعد تمرين أكاديمية Next Generation Tennis Academy',
          'BEGIN:VALARM',
          'TRIGGER:-PT60M',
          'ACTION:DISPLAY',
          'DESCRIPTION:تذكير بموعد التمرين بعد ساعة',
          'END:VALARM',
          'END:VEVENT',
          'END:VCALENDAR'
        ].join('\r\n');

        const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `NXT_Gen_${cleanDate}.ics`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('تم تجهيز ملف التقويم بالتذكير التلقائي');
      } catch (e) {
        showToast('تعذر إنشاء حدث التقويم');
      }
    }

    async function confirmAttendance(target, rowIndex, statusText) {
      const u = appState.user || {};
      const playerName = u.players && u.players[0] ? u.players[0]['Player_Name'] : '';
      try {
        showToast('جاري إرسال ردك للمدرب...');
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'attendance',
            authEmail: u.email || '',
            target,
            rowIndex,
            statusText,
            playerName
          })
        });
        const json = await res.json();
        showToast(json.message || 'تم التسجيل');
        if (json.status === 'success') refreshData(false, true);
      } catch (e) {
        showToast('تعذر إرسال الحالة');
      }
    }

    // =========================================================================
    // CRUD & WRITE OPERATIONS
    // =========================================================================
    let currentCrudContext = null;

    function openCrudForm(title, fields, context) {
      currentCrudContext = context;
      document.getElementById('crudModalTitle').textContent = title;
      const form = document.getElementById('crudForm');
      form.innerHTML = fields.map(f => `
        <div class="form-group">
          <label>${f.label}</label>
          <input type="${f.type || 'text'}" name="${f.name}" value="${escapeHtml(f.value || '')}"
                 placeholder="${escapeHtml(f.placeholder || '')}"
                 class="form-control" ${f.required ? 'required' : ''} ${f.readonly ? 'readonly' : ''} />
        </div>
      `).join('') + `<button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">حفظ التعديلات في الشيت</button>`;
      document.getElementById('crudModal').classList.add('open');
    }

    async function submitCrudForm(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      const payload = {};
      formData.forEach((val, key) => { payload[key] = val; });

      await sendWriteRequest({
        op: currentCrudContext.op,
        target: currentCrudContext.target,
        rowIndex: currentCrudContext.rowIndex,
        payload
      });
      closeModal('crudModal');
    }

    async function sendWriteRequest(body) {
      const u = appState.user || {};
      try {
        showToast('جاري الحفظ في جوجل شيت...');
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'write',
            authEmail: u.email || '',
            authCode: u.code || '',
            ...body
          })
        });
        const json = await res.json();
        showToast(json.message || 'تم التنفيذ');
        if (json.status === 'success') {
          refreshData(false, true);
        }
      } catch (err) {
        showToast('حدث خطأ أثناء الاتصال بالشيت');
      }
    }

    function deleteRow(target, rowIndex) {
      if (!confirm('هل أنت متأكد من الحذف نهائياً من الشيت؟')) return;
      sendWriteRequest({ op: 'delete', target, rowIndex });
    }

    function openAddPrivateModal() {

    function openEditPrivateModal(pr) {
      openCrudForm('تعديل حصة Private', [
        { name: 'اسم اللاعب', label: 'اسم اللاعب', value: pr['اسم اللاعب'], required: true },
        { name: 'اليوم', label: 'التاريخ', value: pr['اليوم'], required: true },

    function openAddCoachModal() {
      const isSuperAdmin = appState.user?.role === 'super_admin';
      const fields = [
        { name: 'كود المدرب', label: 'كود المدرب (يتم توليده تلقائياً)', value: 'تلقائي', readonly: true },
        { name: 'اسم المدرب', label: 'اسم المدرب', required: true },
        { name: 'رقم المدرب', label: 'رقم هاتف المدرب', required: true },
        { name: 'الفرع', label: 'الفرع', value: 'Qatameya', required: true }
      ];
      if (isSuperAdmin) {
        fields.push(
          { name: 'ايميل المدرب', label: 'ايميل المدرب للدخول', type: 'email', required: true },
          { name: 'login code', label: 'رمز الدخول (Login Code)', required: true }
        );
      }
      openCrudForm('إضافة مدرب جديد', fields, { op: 'add', target: 'coaches' });
    }

    function openEditCoachModal(c) {
      const isSuperAdmin = appState.user?.role === 'super_admin';
      const fields = [
        { name: 'اسم المدرب', label: 'اسم المدرب', value: c['اسم المدرب'], required: true },
        { name: 'رقم المدرب', label: 'رقم المدرب', value: c['رقم المدرب'], required: true },
        { name: 'الفرع', label: 'الفرع', value: c['الفرع'] }

        fields.push(
          { name: 'ايميل المدرب', label: 'ايميل المدرب', value: c['ايميل المدرب'] },
          { name: 'login code', label: 'رمز الدخول (Login Code)', value: c['login code'] }
        );

      openCrudForm('تعديل بيانات المدرب', fields, { op: 'update', target: 'coaches', rowIndex: c._rowIndex });

    function openAddEduModal() {
      openCrudForm('إضافة محتوى تعليمي جديد', [
        { name: 'معرف المحتوى', label: 'معرف المحتوى (تلقائي)', value: 'تلقائي', readonly: true },
        { name: 'عنوان الدرس', label: 'عنوان الدرس', required: true },
        { name: 'نوع الرياضة / التصنيف', label: 'التصنيف (تنس / بادل / لياقة)', required: true },
        { name: 'نوع الوسائط', label: 'نوع الوسائط (فيديو / مقال)', required: true },
        { name: 'رابط المادة', label: 'رابط المادة', required: true },
        { name: 'الفئة المستهدفة', label: 'الفئة المستهدفة', value: 'جميع اللاعبين' },
        { name: 'cover', label: 'رابط صورة الغلاف' }

    function openAddSubModal() {
      openCrudForm('إضافة حالة اشتراك', [
        { name: 'كود اللاعب', label: 'كود اللاعب (مثال: P01)', required: true },
        { name: 'اسم اللاعب', label: 'اسم اللاعب', required: true },
        { name: 'الفريق', label: 'الفريق', required: true },
        { name: 'الشهر', label: 'الشهر (مثال: ديسمبر)', required: true },
        { name: 'هل تم الدفع', label: 'حالة الدفع (TRUE أو FALSE)', value: 'TRUE', required: true }
      ], { op: 'add', target: 'subscriptions' });
    }

    function toggleSubscriptionPaid(rowIndex, newStatus) {
      sendWriteRequest({
        op: 'update',
        target: 'subscriptions',
        rowIndex,
        payload: { 'هل تم الدفع': newStatus ? 'TRUE' : 'FALSE' }
      });
    }

    function approveNewPlayer(resp) {
      sendWriteRequest({
        op: 'approve_response',
        target: 'players',
        payload: {
          Player_Name: resp['أسم اللاعب'],
          Parent_Name: resp['اسم الوالد'],
          Parent_Phone: resp['رقم تليفون الوالد'],
          Parent_Email: resp['ايميل الوالد'] || ''
        }
      });
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
